<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia sesión en cxv-app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .netflix-input {
            background: #333;
            border: none;
            border-radius: 4px;
            color: white;
            padding: 16px 20px;
            width: 100%;
        }

        .netflix-input::placeholder {
            color: #8c8c8c;
        }

        .netflix-btn {
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }

        .netflix-btn:hover {
            background-color: #c11119;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col font-sans">

    <div class="p-6">
        <h1 class="text-red-600 text-4xl font-bold tracking-tighter uppercase drop-shadow-lg">cxv-app</h1>
    </div>

    <div class="flex-1 flex items-center justify-center p-4">
        <div class="bg-black/80 p-12 rounded md:w-[450px] w-full min-h-[500px] flex flex-col gap-8">
            <h2 class="text-3xl font-bold text-white mb-2">Inicia sesión</h2>

            <form id="loginForm" class="flex flex-col gap-4">
                <div>
                    <input type="email" id="email" class="netflix-input focus:outline-none focus:bg-[#454545]"
                        placeholder="Email o número de teléfono" required>
                </div>
                <div>
                    <input type="password" id="password" class="netflix-input focus:outline-none focus:bg-[#454545]"
                        placeholder="Contraseña" required>
                </div>

                <div id="errorMsg" class="text-[#e87c03] text-sm hidden font-semibold"></div>
                <pre id="responseBox"
                    class="hidden bg-[#111] text-[#e5e5e5] text-xs p-3 rounded border border-[#333] whitespace-pre-wrap break-words"></pre>

                <button type="submit" class="netflix-btn mt-6 text-lg">
                    Iniciar sesión
                </button>

                <div class="flex justify-between items-center text-[#b3b3b3] text-sm mt-2">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" class="w-4 h-4 accent-[#737373] bg-[#333] border-none rounded-sm">
                        Recuérdame
                    </label>
                    <a href="#" class="hover:underline">¿Necesitas ayuda?</a>
                </div>
            </form>

            <div class="mt-8 text-[#737373]">
                <!-- <p>¿Primera vez en cxv-app? <a href="#" class="text-white hover:underline">Suscríbete ahora.</a></p> -->
                <!-- <p class="text-xs mt-4">Esta página está protegida por Google reCAPTCHA para comprobar que no eres un
                    robot.</p> -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = '{{SUPABASE_URL}}';
        const SUPABASE_KEY = '{{SUPABASE_KEY}}';

        // Rename to avoid clashing with the global "supabase" exposed by the CDN script
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');
        const responseBox = document.getElementById('responseBox');

        const showResponse = (title, payload) => {
            if (!responseBox) return;
            responseBox.textContent = `${title}\n${JSON.stringify(payload, null, 2)}`;
            responseBox.classList.remove('hidden');
        };

        console.info('[login] initializing Supabase client', {
            urlPresent: Boolean(SUPABASE_URL),
            keyPresent: Boolean(SUPABASE_KEY)
        });
        if (!SUPABASE_URL || !SUPABASE_KEY) {
            console.warn('[login] missing Supabase environment variables; authentication will fail', {
                urlPresent: Boolean(SUPABASE_URL),
                keyPresent: Boolean(SUPABASE_KEY)
            });
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            console.info('[login] submit attempt', { email });
            errorMsg.classList.add('hidden');
            responseBox.classList.add('hidden');

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    console.error('[login] signInWithPassword error', {
                        email,
                        code: error.code,
                        message: error.message,
                        status: error.status
                    });
                    errorMsg.innerText = "Credenciales incorrectas. Intenta de nuevo.";
                    errorMsg.classList.remove('hidden');
                    showResponse('Respuesta de login (error)', {
                        email,
                        code: error.code,
                        message: error.message,
                        status: error.status
                    });
                    return;
                }

                showResponse('Respuesta de login (exito)', {
                    email,
                    userId: data?.user?.id || null,
                    hasSession: Boolean(data?.session)
                });
                console.info('[login] sign-in success, redirecting', { email, hasSession: Boolean(data?.session) });
                window.location.href = '/dashboard';
            } catch (err) {
                console.error('[login] unexpected exception during sign-in', err);
                errorMsg.innerText = "Hubo un error al iniciar sesion. Intenta de nuevo.";
                errorMsg.classList.remove('hidden');
                showResponse('Respuesta de login (excepcion inesperada)', {
                    email,
                    message: err?.message || 'Unknown error'
                });
            }
        });

        async function checkSession() {
            console.info('[login] checking existing session');
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (error) {
                    console.error('[login] session lookup error', { code: error.code, message: error.message });
                    return;
                }
                if (session) {
                    console.info('[login] session found, redirecting to dashboard');
                    window.location.href = '/dashboard';
                } else {
                    console.info('[login] no active session detected');
                }
            } catch (err) {
                console.error('[login] unexpected exception while checking session', err);
            }
        }
        checkSession();
    </script>
</body>

</html>
