<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - cxv-app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #141414;
            color: white;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="min-h-screen font-sans pb-20 p-4 md:p-8 max-w-5xl mx-auto">

    <div
        class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 md:mb-8 border-b border-gray-800 pb-4 gap-4">
        <h1 class="text-2xl md:text-3xl font-bold">Editor de Título</h1>
        <div class="flex gap-2 w-full md:w-auto">
            <button onclick="save()"
                class="flex-1 md:flex-none bg-red-600 text-white px-4 md:px-6 py-2 rounded font-bold hover:bg-red-700 text-sm md:text-base">Guardar</button>
            <a href="/catalog"
                class="flex-1 md:flex-none bg-gray-700 text-white px-4 md:px-6 py-2 rounded font-bold hover:bg-gray-600 text-center text-sm md:text-base">Cancelar</a>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">
        <!-- Preview -->
        <div>
            <label class="block text-gray-400 text-sm mb-1">Vista Previa</label>
            <div id="posterPreviewContainer"
                class="aspect-[2/3] bg-[#222] rounded overflow-hidden border border-gray-700 w-1/2 md:w-full mx-auto md:mx-0">
                <!-- Content injected via JS -->
            </div>
        </div>
        <!-- Metadata Form -->
        <div class="lg:col-span-2 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-400 text-sm mb-1">Nombre</label>
                    <input type="text" id="name" class="w-full bg-[#222] border border-gray-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-gray-400 text-sm mb-1">Nombre Original</label>
                    <input type="text" id="originalName"
                        class="w-full bg-[#222] border border-gray-700 rounded p-2 text-white">
                </div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-4">
                <div>
                    <label class="block text-gray-400 text-sm mb-1">IMDb ID</label>
                    <input type="text" id="imdbId"
                        class="w-full bg-[#222] border border-gray-700 rounded p-2 text-white font-mono">
                </div>
                <div>
                    <label class="block text-gray-400 text-sm mb-1">Año</label>
                    <input type="number" id="year"
                        class="w-full bg-[#222] border border-gray-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-gray-400 text-sm mb-1">Tipo</label>
                    <select id="type" class="w-full bg-[#222] border border-gray-700 rounded p-2 text-white"
                        onchange="renderStreams()">
                        <option value="movie">Película</option>
                        <option value="series">Serie</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-400 text-sm mb-1">Estado</label>
                    <select id="isEnabled" class="w-full bg-[#222] border border-gray-700 rounded p-2 text-white">
                        <option value="true">Activo</option>
                        <option value="false">Oculto</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-gray-400 text-sm mb-1">Poster URL</label>
                <input type="text" id="poster" class="w-full bg-[#222] border border-gray-700 rounded p-2 text-white"
                    onchange="updatePreview()">
            </div>
            <div>
                <label class="block text-gray-400 text-sm mb-1">Sinopsis</label>
                <textarea id="overview" rows="5"
                    class="w-full bg-[#222] border border-gray-700 rounded p-2 text-white"></textarea>
            </div>
        </div>
    </div>

    <!-- Streams Section -->
    <div class="mt-12">
        <div class="flex flex-wrap justify-between items-end mb-4 border-b border-gray-800 pb-2 gap-2">
            <h2 class="text-xl font-bold">Streams / Enlaces</h2>
            <div class="flex gap-2">
                <button onclick="openMegaModal()"
                    class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700">
                    <i class="fa-solid fa-cloud-arrow-down mr-2"></i> Importar Mega
                </button>
                <button onclick="openStreamModal()"
                    class="bg-gray-700 text-white px-3 py-1 rounded text-sm hover:bg-gray-600">
                    <i class="fa-solid fa-plus mr-2"></i> Manual
                </button>
            </div>
        </div>

        <div id="streamsContainer" class="space-y-4">
            <!-- Injected via JS -->
        </div>

        <div id="noStreams" class="text-gray-500 text-center py-4 hidden">No hay streams asociados.</div>
    </div>

    <!-- Modals -->
    <!-- Mega Import Modal -->
    <div id="megaModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-[#222] p-6 rounded-lg max-w-lg w-full">
            <h3 class="text-xl font-bold mb-4">Importar desde Mega</h3>
            <p class="text-gray-400 text-sm mb-4">Introduce el enlace de archivo o carpeta de Mega. Se intentará
                detectar automáticamente Temporada y Episodio si es una serie.</p>
            <input type="text" id="megaUrlInput" placeholder="https://mega.nz/..."
                class="w-full bg-black border border-gray-700 rounded p-2 text-white mb-4">
            <div class="flex justify-end gap-2">
                <button onclick="closeMegaModal()" class="px-4 py-2 hover:bg-white/10 rounded">Cancelar</button>
                <button onclick="doImportMega()" class="bg-blue-600 px-4 py-2 rounded font-bold hover:bg-blue-700"
                    id="btnImport">Importar</button>
            </div>
        </div>
    </div>

    <!-- Edit/Add Stream Modal -->
    <div id="streamModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-[#222] p-6 rounded-lg max-w-md w-full">
            <h3 class="text-xl font-bold mb-4" id="streamModalTitle">Editar Stream</h3>
            <input type="hidden" id="editStreamId">
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-500">Etiqueta (Nombre archivo)</label>
                    <input type="text" id="editLabel"
                        class="w-full bg-black border border-gray-700 rounded p-2 text-white text-sm">
                </div>
                <div>
                    <label class="text-xs text-gray-500">URL</label>
                    <input type="text" id="editUrl"
                        class="w-full bg-black border border-gray-700 rounded p-2 text-white text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-gray-500">Temporada</label>
                        <input type="number" id="editSeason"
                            class="w-full bg-black border border-gray-700 rounded p-2 text-white text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">Episodio</label>
                        <input type="number" id="editEpisode"
                            class="w-full bg-black border border-gray-700 rounded p-2 text-white text-sm">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-gray-500">Prioridad</label>
                    <input type="number" id="editPriority"
                        class="w-full bg-black border border-gray-700 rounded p-2 text-white text-sm">
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeStreamModal()" class="px-4 py-2 hover:bg-white/10 rounded">Cancelar</button>
                <button onclick="saveStream()"
                    class="bg-red-600 px-4 py-2 rounded font-bold hover:bg-red-700">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = '{{SUPABASE_URL}}';
        const SUPABASE_KEY = '{{SUPABASE_KEY}}';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let authToken = null;
        let currentStreams = [];
        let activeSeason = null;

        // ID from URL: /editor/:id
        const paths = window.location.pathname.split('/');
        const id = paths[paths.length - 1];

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = '/login'; return; }
            authToken = session.access_token;

            if (id && id !== 'editor') {
                loadData(id);
            }
        }

        async function loadData(titleId) {
            const res = await fetch(`/api/catalog/title/${titleId}`, { headers: { Authorization: `Bearer ${authToken}` } });
            const { data } = await res.json();

            document.getElementById('name').value = data.name;
            document.getElementById('originalName').value = data.original_name || '';
            document.getElementById('year').value = data.year;
            document.getElementById('imdbId').value = data.imdb_id || '';
            document.getElementById('type').value = data.type;
            document.getElementById('isEnabled').value = data.is_enabled;
            document.getElementById('poster').value = data.poster_url;
            document.getElementById('overview').value = data.overview || '';

            updatePreview();
            currentStreams = data.cxv_stream || [];
            renderStreams();
        }

        function updatePreview() {
            const url = document.getElementById('poster').value;
            const name = document.getElementById('name').value || 'TITULO';
            const container = document.getElementById('posterPreviewContainer');

            // Helper for colors
            const colors = ['from-red-900 to-red-600', 'from-blue-900 to-blue-600', 'from-purple-900 to-purple-600'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            const bgClass = colors[Math.abs(hash) % colors.length];

            if (url && url.length > 5) {
                container.innerHTML = `<img src="${url}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full bg-gradient-to-br ${bgClass} flex flex-col items-center justify-center p-4 text-center\\'><h1 class=\\'text-3xl font-black text-white uppercase drop-shadow-xl\\'>${name}</h1></div>'">`;
            } else {
                container.innerHTML = `<div class="w-full h-full bg-gradient-to-br ${bgClass} flex flex-col items-center justify-center p-4 text-center">
                    <h1 class="text-3xl font-black text-white uppercase drop-shadow-xl">${name}</h1>
                </div>`;
            }
        }

        function renderStreams() {
            const container = document.getElementById('streamsContainer');
            container.innerHTML = '';

            if (!currentStreams || currentStreams.length === 0) {
                document.getElementById('noStreams').classList.remove('hidden');
                return;
            } else {
                document.getElementById('noStreams').classList.add('hidden');
            }

            const type = document.getElementById('type').value;

            if (type === 'series') {
                // Group by Season
                const seasons = {};
                currentStreams.forEach(s => {
                    const se = s.season || 0;
                    if (!seasons[se]) seasons[se] = [];
                    seasons[se].push(s);
                });

                const seasonKeys = Object.keys(seasons).sort((a, b) => a - b);
                if (seasonKeys.length === 0) return;

                if (!activeSeason || !seasons[activeSeason]) {
                    activeSeason = seasonKeys[0];
                }

                // 1. Tab Headers
                const tabsContainer = document.createElement('div');
                tabsContainer.className = "flex gap-2 overflow-x-auto border-b border-gray-800 pb-2 mb-4 hide-scrollbar";

                seasonKeys.forEach(sKey => {
                    const btn = document.createElement('button');
                    const isActive = sKey === activeSeason;
                    btn.className = `px-4 py-2 rounded font-bold text-sm whitespace-nowrap transition ${isActive ? 'bg-red-600 text-white' : 'bg-[#222] text-gray-400 hover:text-white'
                        }`;
                    btn.innerText = sKey === '0' ? 'Extras' : `Temporada ${sKey}`;
                    btn.onclick = () => {
                        activeSeason = sKey;
                        renderStreams(); // Re-render to update active content
                    };
                    tabsContainer.appendChild(btn);
                });
                container.appendChild(tabsContainer);

                // 2. Content (Active Season Episodes)
                const seasonEpisodes = seasons[activeSeason];
                const table = document.createElement('table');
                table.className = "w-full text-left border-collapse text-sm bg-[#1a1a1a] rounded overflow-hidden";
                table.innerHTML = `
                    <thead class="bg-black/20 text-gray-500 border-b border-gray-800">
                        <tr><th class="p-3">Episodio</th><th class="p-3">Etiqueta</th><th class="p-3 text-right">Acciones</th></tr>
                    </thead>
                `;
                const tbody = document.createElement('tbody');

                if (seasonEpisodes) {
                    seasonEpisodes.sort((a, b) => (a.episode - b.episode)).forEach(s => {
                        const tr = document.createElement('tr');
                        tr.className = "border-b border-gray-800/50 hover:bg-white/5";
                        tr.innerHTML = `
                            <td class="p-3 w-20 text-center font-bold text-xl text-gray-500">${s.episode}</td>
                            <td class="p-3 truncate max-w-[200px]" title="${s.url}">
                                <div class="font-bold text-white mb-1">${s.label}</div>
                                ${(s.season && s.episode) ? `<div class="text-xs text-yellow-500 font-mono font-bold mb-1">[S${s.season}E${s.episode}]</div>` : ''}
                                <div class="text-[10px] text-blue-400 cursor-pointer hover:underline font-mono truncate" onclick="window.open('${s.url}', '_blank')">${s.url}</div>
                            </td>
                            <td class="p-3 text-right whitespace-nowrap">
                                <button onclick="playStream('${s.id}')" class="bg-green-900/40 hover:bg-green-600 text-green-400 hover:text-white p-2 rounded mr-1 transition" title="Reproducir"><i class="fa-solid fa-play"></i></button>
                                <button onclick="playExternal('${s.id}')" class="bg-orange-900/40 hover:bg-orange-600 text-orange-400 hover:text-white p-2 rounded mr-1 transition" title="Abrir Externo (VLC)"><i class="fa-solid fa-up-right-from-square"></i></button>
                                <button onclick='openStreamModal(${JSON.stringify(s).replace(/'/g, "&apos;")})' class="bg-gray-800 hover:bg-gray-700 text-white p-2 rounded mr-1 transition"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteStream('${s.id}')" class="bg-red-900/50 hover:bg-red-600 text-white p-2 rounded transition"><i class="fa-solid fa-trash"></i></button>
                            </td>
                         `;
                        tbody.appendChild(tr);
                    });
                }
                table.appendChild(tbody);
                container.appendChild(table);

            } else {
                // Movie Stream Table
                const table = document.createElement('table');
                table.className = "w-full text-left border-collapse";
                table.innerHTML = `
                    <thead class="text-gray-400 text-sm border-b border-gray-800">
                        <tr><th class="py-2">Etiqueta</th><th class="py-2">URL</th><th class="py-2 text-right">Acciones</th></tr>
                    </thead>
                `;
                const tbody = document.createElement('tbody');
                currentStreams.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-b border-gray-800 hover:bg-[#222] transition';
                    tr.innerHTML = `
                        <td class="py-3 text-sm font-bold">
                            ${s.label}
                            ${(s.season && s.episode) ? `<div class="text-xs text-yellow-500 font-mono font-bold mt-1">[S${s.season}E${s.episode}]</div>` : ''}
                        </td>
                        <td class="py-3 text-sm font-mono truncate max-w-xs text-blue-400 cursor-pointer hover:underline" onclick="window.open('${s.url}', '_blank')">${s.url}</td>
                        <td class="py-3 text-right whitespace-nowrap">
                             <button onclick="playStream('${s.id}')" class="bg-green-900/40 hover:bg-green-600 text-green-400 hover:text-white p-2 rounded mr-1 transition" title="Reproducir"><i class="fa-solid fa-play"></i></button>
                             <button onclick="playExternal('${s.id}')" class="bg-orange-900/40 hover:bg-orange-600 text-orange-400 hover:text-white p-2 rounded mr-1 transition" title="Abrir Externo (VLC)"><i class="fa-solid fa-up-right-from-square"></i></button>
                             <button onclick='openStreamModal(${JSON.stringify(s).replace(/'/g, "&apos;")})' class="bg-gray-800 hover:bg-gray-700 text-white p-2 rounded mr-1 transition"><i class="fa-solid fa-pen"></i></button>
                             <button onclick="deleteStream('${s.id}')" class="bg-red-900/50 hover:bg-red-600 text-white p-2 rounded transition"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                table.append(tbody);
                container.appendChild(table);
            }
        }

        function playStream(streamId) {
            window.open(`/api/catalog/stream/${streamId}/play?token=${authToken}`, '_blank');
        }

        function playExternal(streamId) {
            // VLC Protocol or generic intent
            const streamUrl = `${window.location.origin}/api/catalog/stream/${streamId}/play?token=${authToken}`;
            window.open(`vlc://${streamUrl}`, '_self');
        }

        async function save() {
            const body = {
                id: (id && id !== 'editor') ? id : undefined,
                name: document.getElementById('name').value,
                originalName: document.getElementById('originalName').value,
                year: document.getElementById('year').value,
                imdbId: document.getElementById('imdbId').value,
                type: document.getElementById('type').value,
                isEnabled: document.getElementById('isEnabled').value === 'true',
                poster: document.getElementById('poster').value,
                overview: document.getElementById('overview').value
            };

            const res = await fetch('/api/catalog/title', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify(body)
            });

            const result = await res.json();
            if (result.success) {
                alert('Guardado correctamente');
                if (!id || id === 'editor') window.location.href = `/editor/${result.data.id}`;
            } else {
                alert('Error: ' + result.error);
            }
        }

        // --- Stream Logic ---
        function openMegaModal() { document.getElementById('megaModal').classList.remove('hidden'); }
        function closeMegaModal() { document.getElementById('megaModal').classList.add('hidden'); }

        async function doImportMega() {
            const url = document.getElementById('megaUrlInput').value;
            if (!url) return alert("URL vacía");
            if (!id || id === 'editor') return alert("Guarda el título antes de agregar streams.");

            const btn = document.getElementById('btnImport');
            btn.innerText = "Procesando...";
            btn.disabled = true;

            try {
                const res = await fetch(`/api/catalog/title/${id}/import-mega`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({ url })
                });
                const data = await res.json();
                if (data.success) {
                    alert(`Importados ${data.count} archivos.`);
                    closeMegaModal();
                    loadData(id); // Reload
                } else {
                    alert("Error: " + data.error);
                }
            } catch (e) { console.error(e); alert("Error de red"); }

            btn.innerText = "Importar";
            btn.disabled = false;
        }

        function openStreamModal(stream = null) {
            document.getElementById('streamModal').classList.remove('hidden');
            if (stream) {
                document.getElementById('streamModalTitle').innerText = "Editar Stream";
                document.getElementById('editStreamId').value = stream.id;
                document.getElementById('editLabel').value = stream.label;
                document.getElementById('editUrl').value = stream.url;
                document.getElementById('editSeason').value = stream.season;
                document.getElementById('editEpisode').value = stream.episode;
                document.getElementById('editPriority').value = stream.priority;
            } else {
                document.getElementById('streamModalTitle').innerText = "Nuevo Stream";
                document.getElementById('editStreamId').value = "";
                document.getElementById('editLabel').value = "";
                document.getElementById('editUrl').value = "";
                document.getElementById('editSeason').value = "0";
                document.getElementById('editEpisode').value = "0";
                document.getElementById('editPriority').value = "1";
            }
        }
        function closeStreamModal() { document.getElementById('streamModal').classList.add('hidden'); }

        async function saveStream() {
            const sid = document.getElementById('editStreamId').value;
            const body = {
                id: sid || undefined,
                titleId: id,
                label: document.getElementById('editLabel').value,
                url: document.getElementById('editUrl').value,
                season: parseInt(document.getElementById('editSeason').value),
                episode: parseInt(document.getElementById('editEpisode').value),
                priority: parseInt(document.getElementById('editPriority').value),
                isEnabled: true
            };

            if (!id || id === 'editor') return alert("Guarda el título primero.");

            await fetch('/api/catalog/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify(body)
            });

            closeStreamModal();
            loadData(id);
        }

        async function deleteStream(streamId) {
            if (!confirm('¿Eliminar stream?')) return;
            await fetch(`/api/catalog/stream/${streamId}`, { method: 'DELETE', headers: { Authorization: `Bearer ${authToken}` } });
            location.reload();
        }

        init();
    </script>
</body>

</html>
