<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - cxv-app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #141414;
            color: white;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .movie-card {
            transition: transform 0.3s;
            position: relative;
        }

        .movie-card:hover {
            transform: scale(1.05);
            z-index: 20;
        }

        .hero-gradient {
            background: linear-gradient(to top, #141414 10%, transparent 100%);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="min-h-screen font-sans pb-20">

    <!-- Navbar -->
    <div class="fixed top-0 w-full z-50 bg-gradient-to-b from-black/90 to-transparent px-4 py-3 flex flex-wrap justify-between items-center transition-all bg-black/80 backdrop-blur-sm"
        id="navbar">
        <h1 class="text-red-600 text-xl md:text-2xl font-bold tracking-tighter uppercase cursor-pointer"
            onclick="window.location.href='/dashboard'">cxv-app</h1>

        <div class="flex gap-4 text-xs md:text-sm order-3 md:order-none w-full md:w-auto mt-2 md:mt-0 justify-center">
            <a href="/dashboard" class="text-white opacity-80 hover:opacity-100 transition">Inicio</a>
            <a href="#" class="text-white font-bold border-b-2 border-red-600 pb-1">Catálogo</a>
            <a href="/scan" class="text-white opacity-80 hover:opacity-100 transition">Escanear</a>
        </div>

        <div class="flex items-center gap-2 md:gap-4 order-2 md:order-none">
            <div
                class="bg-black/50 border border-white/30 px-2 py-1 rounded flex items-center gap-2 focus-within:border-white transition">
                <i class="fa-solid fa-search text-gray-400 text-xs"></i>
                <input type="text" id="searchInput" placeholder="Buscar..."
                    class="bg-transparent border-none outline-none text-white text-xs md:text-sm w-24 md:w-48 placeholder-gray-500">
            </div>
            <button onclick="logout()" class="text-gray-400 hover:text-white transition"><i
                    class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </div>

    <!-- Main Container -->
    <div id="mainContent">
        <!-- Hero Section -->
        <div class="relative h-[55vh] md:h-[85vh] w-full bg-gray-900 group" id="heroSection">
            <!-- Hero Background (Image OR Placeholder) -->
            <div id="heroBg" class="w-full h-full relative">
                <!-- Injected via JS -->
            </div>

            <div class="absolute inset-0 hero-gradient"></div>
            <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-transparent to-transparent"></div>

            <div class="absolute bottom-[10%] md:bottom-[20%] left-[4%] max-w-[90%] md:max-w-2xl pr-4 z-10 cursor-pointer group-hover:scale-[1.01] transition duration-300 pb-6"
                onclick="editHero()">
                <span
                    class="text-red-500 font-extrabold tracking-widest uppercase text-[10px] md:text-sm mb-2 block animate-pulse"
                    id="heroType">DESTACADO</span>
                <h1 class="text-3xl sm:text-5xl md:text-7xl font-black mb-2 md:mb-4 leading-none tracking-tight drop-shadow-lg"
                    id="heroTitle">Cargando...</h1>

                <div class="flex items-center gap-2 mb-3 md:mb-4 text-xs md:text-sm font-semibold text-gray-300">
                    <span id="heroYear" class="bg-gray-800 px-1.5 py-0.5 rounded text-white">...</span>
                </div>

                <p class="text-gray-300 text-xs sm:text-sm md:text-lg mb-4 md:mb-6 line-clamp-3 md:line-clamp-4 font-medium drop-shadow-md max-w-prose"
                    id="heroOverview">...</p>
            </div>
        </div>

        <!-- Rows -->
        <div class="pl-[4%] mt-[-50px] md:mt-[-100px] relative z-20 space-y-8 md:space-y-12 pb-10">
            <!-- Recents -->
            <section>
                <h3
                    class="text-base md:text-xl font-bold mb-3 md:mb-4 text-gray-200 hover:text-white cursor-pointer group flex items-center gap-2">
                    Recientemente Agregados <i
                        class="fa-solid fa-chevron-right text-xs opacity-0 group-hover:opacity-100 transition text-red-600"></i>
                </h3>
                <div class="flex gap-2 md:gap-3 overflow-x-auto hide-scrollbar pt-4 pb-4 md:pb-8" id="recentRow"></div>
            </section>

            <!-- Movies -->
            <section>
                <h3 class="text-base md:text-xl font-bold mb-3 md:mb-4 text-gray-200 hover:text-white cursor-pointer group flex items-center gap-2"
                    onclick="showGrid('movie')">
                    Películas <i
                        class="fa-solid fa-chevron-right text-xs opacity-0 group-hover:opacity-100 transition text-red-600"></i>
                </h3>
                <div class="flex gap-2 md:gap-3 overflow-x-auto hide-scrollbar pt-4 pb-4 md:pb-8" id="moviesRow"></div>
            </section>

            <!-- Series -->
            <section>
                <h3 class="text-base md:text-xl font-bold mb-3 md:mb-4 text-gray-200 hover:text-white cursor-pointer group flex items-center gap-2"
                    onclick="showGrid('series')">
                    Series <i
                        class="fa-solid fa-chevron-right text-xs opacity-0 group-hover:opacity-100 transition text-red-600"></i>
                </h3>
                <div class="flex gap-2 md:gap-3 overflow-x-auto hide-scrollbar pt-4 pb-4 md:pb-8" id="seriesRow"></div>
            </section>
        </div>
    </div>

    <!-- Grid View -->
    <div id="gridView" class="hidden pt-24 px-[4%] min-h-screen">
        <div class="flex items-center gap-4 mb-6">
            <button onclick="showMain()" class="text-gray-400 hover:text-white"><i
                    class="fa-solid fa-arrow-left text-xl"></i></button>
            <h2 class="text-2xl font-bold" id="gridTitle">Resultados</h2>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 md:gap-6" id="gridContainer">
        </div>
    </div>

    <!-- Floating Action Button -->
    <button onclick="openImportModal()"
        class="fixed bottom-6 right-6 bg-red-600 hover:bg-red-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-xl z-40 transition transform hover:scale-110 active:scale-95 group">
        <i class="fa-solid fa-plus group-hover:rotate-90 transition duration-300"></i>
    </button>

    <!-- Import Modal -->
    <div id="importModal"
        class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm fade-in">
        <div
            class="bg-gray-900/90 border border-white/10 rounded-xl p-6 w-full max-w-md shadow-2xl transform transition-all scale-100 relative">
            <h3 class="text-xl font-bold mb-4 text-white">Importar Título</h3>
            <p class="text-gray-400 text-sm mb-4">Ingresa el ID de IMDb del título (ej. <code
                    class="text-red-400">tt0111161</code>). Se obtendrán los metadatos automáticamente.</p>

            <input type="text" id="importImdbId" placeholder="IMDb ID (tt...)"
                class="w-full bg-black/50 border border-gray-700 rounded-lg px-4 py-3 text-white mb-6 focus:border-red-600 focus:outline-none transition">

            <div class="flex justify-end gap-3">
                <button onclick="closeImportModal()"
                    class="px-4 py-2 text-gray-400 hover:text-white transition">Cancelar</button>
                <button onclick="importTitle()" id="btnImport"
                    class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg font-bold shadow-lg transition transform hover:scale-105">
                    Importar
                </button>
            </div>

            <button onclick="closeImportModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = '{{SUPABASE_URL}}';
        const SUPABASE_KEY = '{{SUPABASE_KEY}}';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let authToken = null;
        let heroItem = null;

        // --- Helper: Colors ---
        function getPlaceholderColor(title) {
            const colors = [
                'from-red-900 to-red-600', 'from-blue-900 to-blue-600', 'from-green-900 to-green-600',
                'from-purple-900 to-purple-600', 'from-yellow-700 to-yellow-500', 'from-pink-900 to-pink-600'
            ];
            let hash = 0;
            for (let i = 0; i < title.length; i++) hash = title.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        // --- Helper: Robust Card HTML ---
        function createCardHtml(item, isHero = false) {
            const title = item.name || "Unknown";
            const bgClass = getPlaceholderColor(title);
            const posterUrl = item.poster_url || "";

            // Stream Count Logic - Supabase returns [{ count: N }]
            let streamCount = 0;
            if (item.cxv_stream && item.cxv_stream[0] && typeof item.cxv_stream[0].count === 'number') {
                streamCount = item.cxv_stream[0].count;
            } else if (item.cxv_stream && typeof item.cxv_stream.length === 'number') {
                // Fallback if it returned array of objects instead of count (unlikely with count query but safe)
                streamCount = item.cxv_stream.length;
            }

            const isGrayscale = streamCount === 0;

            // Safe Title for HTML
            const safeTitle = title.replace(/</g, "&lt;").replace(/>/g, "&gt;");

            if (isHero) {
                return `
                    <div class="w-full h-full relative overflow-hidden bg-gray-900">
                        <div class="absolute inset-0 bg-gradient-to-br ${bgClass} flex items-center justify-center">
                            <h1 class="text-[30vw] font-black text-white/5 select-none uppercase">${safeTitle.charAt(0)}</h1>
                        </div>
                        ${posterUrl ? `<img src="${posterUrl}" class="absolute inset-0 w-full h-full object-cover opacity-60 transition duration-700" 
                            onload="this.style.opacity='0.6'" 
                            onerror="this.style.display='none'">` : ''}
                    </div>
                `;
            }

            // Normal Card
            return `
                <div class="aspect-[2/3] relative w-full h-full bg-[#1a1a1a] overflow-hidden rounded shadow-lg group">
                    <!-- Fallback Layer (Always there, behind image) -->
                    <div class="absolute inset-0 bg-gradient-to-br ${bgClass} flex flex-col items-center justify-center p-2 text-center z-0">
                        <h3 class="text-xs md:text-sm font-black text-white uppercase leading-none drop-shadow-md break-words w-full px-1">${safeTitle}</h3>
                    </div>
                    
                    <!-- Image Layer -->
                    ${posterUrl ? `<img src="${posterUrl}" class="absolute inset-0 w-full h-full object-cover z-10 transition duration-300 group-hover:scale-110 ${isGrayscale ? 'grayscale' : ''}"
                        onerror="this.style.display='none'">` : ''}
                    
                    <!-- Overlay (Gradient) - Only visible if we have a poster or just always on top? -->
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent opacity-100 z-20 pointer-events-none"></div>

                    <!-- Text Overlay -->
                    <div class="absolute bottom-0 left-0 w-full p-2 z-30">
                        <h4 class="font-bold text-[10px] md:text-xs text-white truncate drop-shadow-md">${safeTitle}</h4>
                        <div class="flex justify-between items-center text-[9px] text-gray-400">
                            <span>${item.year || ''}</span>
                            <div class="flex items-center gap-1 ${streamCount === 0 ? 'text-gray-600' : 'text-green-500'}">
                                <i class="fa-solid fa-signal"></i> ${streamCount}
                            </div>
                        </div>
                    </div>
                     <!-- New Badge (3 days = 259200000 ms) -->
                    ${(new Date() - new Date(item.created_at) < 259200000) ? '<div class="absolute top-1 right-1 bg-red-600 text-[8px] font-bold px-1 rounded z-30 shadow-md">NUEVO</div>' : ''}
                </div>
            `;
        }

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = '/login'; return; }
            authToken = session.access_token;
            loadLanding();
        }

        async function loadLanding() {
            try {
                const res = await fetch('/api/catalog/landing', { headers: { Authorization: `Bearer ${authToken}` } });
                const { data } = await res.json();
                if (data.hero) renderHero(data.hero);
                renderRow('recentRow', data.recent);
                renderRow('moviesRow', data.movies);
                renderRow('seriesRow', data.series);
            } catch (e) { console.error(e); }
        }

        function renderHero(item) {
            heroItem = item;
            document.getElementById('heroBg').innerHTML = createCardHtml(item, true);
            document.getElementById('heroTitle').innerText = item.name;
            document.getElementById('heroOverview').innerText = item.overview || "Sin descripción.";
            document.getElementById('heroYear').innerText = item.year || "2024";
            document.getElementById('heroType').innerText = item.type === 'movie' ? 'PELÍCULA' : 'SERIE';
        }

        function renderRow(containerId, items) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (!items) return;
            items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'flex-none w-[140px] md:w-[200px] movie-card cursor-pointer rounded-md overflow-hidden bg-[#222]';
                el.onclick = () => window.location.href = `/editor/${item.id}`;
                el.innerHTML = createCardHtml(item);
                container.appendChild(el);
            });
        }

        // Search & Grid
        const searchInput = document.getElementById('searchInput');
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const val = e.target.value;
            if (val.length > 2) searchTimeout = setTimeout(() => doSearch(val), 500);
            else if (val.length === 0) showMain();
        });

        async function doSearch(q) {
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('gridView').classList.remove('hidden');
            document.getElementById('gridTitle').innerText = `Resultados para "${q}"`;
            const res = await fetch(`/api/catalog/search?q=${q}`, { headers: { Authorization: `Bearer ${authToken}` } });
            const { data } = await res.json();
            renderGrid(data.data);
        }

        function showGrid(type) {
            document.getElementById('searchInput').value = '';
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('gridView').classList.remove('hidden');
            document.getElementById('gridTitle').innerText = type === 'movie' ? "Películas" : "Series";
            fetch(`/api/catalog/search?type=${type}&limit=100`, { headers: { Authorization: `Bearer ${authToken}` } })
                .then(r => r.json()).then(d => renderGrid(d.data.data));
        }

        function showMain() {
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('gridView').classList.add('hidden');
        }

        function renderGrid(items) {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            if (!items) return;
            items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'group cursor-pointer transform transition duration-300 hover:scale-[1.03] hover:z-10 rounded overflow-hidden';
                el.onclick = () => window.location.href = `/editor/${item.id}`;
                el.innerHTML = createCardHtml(item);
                container.appendChild(el);
            });
        }

        // --- Import Modal Functions ---
        function openImportModal() {
            document.getElementById('importModal').classList.remove('hidden');
            document.getElementById('importImdbId').focus();
        }

        function closeImportModal() {
            document.getElementById('importModal').classList.add('hidden');
            document.getElementById('importImdbId').value = '';
        }

        async function importTitle() {
            const imdbId = document.getElementById('importImdbId').value.trim();
            if (!imdbId) return alert('Por favor ingresa un ID de IMDb (ej. tt1234567)');

            const btn = document.getElementById('btnImport');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Importando...';

            try {
                const res = await fetch('/api/catalog/import-imdb', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({ imdbId })
                });
                const data = await res.json();

                if (data.success) {
                    if (data.message) alert(data.message); // e.g. "Title already exists"
                    window.location.href = `/editor/${data.data.id}`;
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (e) {
                alert('Error de conexión: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        function editHero() { if (heroItem) window.location.href = `/editor/${heroItem.id}`; }
        async function deleteHero() {
            if (!heroItem || !confirm(`¿Eliminar ${heroItem.name}?`)) return;
            await fetch(`/api/catalog/title/${heroItem.id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${authToken}` } });
            location.reload();
        }

        async function logout() { await supabase.auth.signOut(); window.location.href = '/login'; }

        init();
    </script>
</body>

</html>
